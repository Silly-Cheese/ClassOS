name: Validate ClassOS

on:
  push:
    branches: [main, phase-4-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/auth-compat.js
          node --check src/terms.js
          node --check src/course-tools.js
          node --check src/gradebook-v4.js
          node --check src/manage.js
          node --check src/ui-fixes.js
          node --check src/lms.js
          node --check src/intelligence.js
          node --check src/production.js
          node --check src/hardening.js
          node --check src/student-assessments.js
          node --check src/firebase.js
          node --check service-worker.js
          node --check tests/firestore.rules.test.mjs
          node --check tests/no-verification.rules.test.mjs
          node --check tests/gradebook.rules.test.mjs

      - name: Install Firestore rules test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase

      - name: Validate Firestore rules and authorization regression tests
        run: |
          npx --yes firebase-tools@14 emulators:exec --project demo-classos --only firestore "node tests/firestore.rules.test.mjs"
          npx --yes firebase-tools@14 emulators:exec --project demo-classos-no-verification --only firestore "node tests/no-verification.rules.test.mjs"
          npx --yes firebase-tools@14 emulators:exec --project demo-classos-gradebook --only firestore "node tests/gradebook.rules.test.mjs"
