name: Validate ClassOS

on:
  push:
    branches: [main, phase-3-intelligence]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/lms.js
          node --check src/intelligence.js
          node --check src/firebase.js
          node --check service-worker.js
